<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#e11d6f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hellofriends" />
    <meta name="format-detection" content="telephone=no" />

    <title>Meet New People &amp; Make Friends | Hellofriends</title>
    <meta
      name="description"
      content="Hellofriends is a friendly social discovery app. Browse profiles, see who is online, and start a voice call, chat or video call. 18+ only."
    />
    <link rel="canonical" href="https://hellofriends-theta.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hellofriends" />
    <meta property="og:title" content="Meet New People &amp; Make Friends | Hellofriends" />
    <meta
      property="og:description"
      content="Browse profiles, see who is online, and start a voice call, chat or video call. 18+ only."
    />
    <meta property="og:image" content="/icons/og-cover.png" />
    <meta property="og:url" content="https://hellofriends-theta.vercel.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meet New People &amp; Make Friends | Hellofriends" />
    <meta
      name="twitter:description"
      content="Browse profiles, see who is online, and start a voice call, chat or video call. 18+ only."
    />
    <meta name="twitter:image" content="/icons/og-cover.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: painted before React hydrates so the first frame is never blank. -->
      <div id="boot-splash" role="status" aria-label="Loading Hellofriends">
        <div class="boot-mark"></div>
        <div class="boot-name">Hellofriends</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Hellofriends needs JavaScript to run. Please enable JavaScript in your browser settings.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
